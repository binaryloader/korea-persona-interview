name: CI

# 트리거는 main push와 모든 PR이다(github-actions.md §2). 경로 필터로 docs/
# 단독 변경을 제외해 불필요한 빌드를 줄인다.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

# 같은 PR/브랜치에 새 푸시가 들어오면 기존 실행을 취소한다(github-actions.md §8).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본 토큰은 read-only로 둔다(github-actions.md §3 최소 권한).
permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # 매트릭스 한 칸이 실패해도 다른 칸은 끝까지 돌린다(github-actions.md §7).
    # Python 버전은 .python-version에 3.12로 고정되어 있다. 미래 버전 호환을 미리
    # 보고 싶으면 본 매트릭스에 항목을 추가한다.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # uv는 lock 동결 동기화를 지원하고 가상 환경 생성도 한 번에 처리한다
      # (python.md §1.1 패키지 매니저 정책). 공식 셋업 액션을 사용한다.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          # uv 자체 버전을 고정해 신규 메이저가 빌드를 깨지 않게 한다.
          version: "0.5.11"
          # uv 캐시(다운로드/리졸버 결과)를 GitHub Actions 캐시에 보관한다.
          # 캐시 키는 lock 파일 해시를 포함해 의존성 변경 시 자동으로 무효화된다.
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # frozen 동기화로 lock 파일과 정확히 같은 그래프를 설치한다
      # (dependency.md §2 production 빌드 정책 준수).
      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip sync requirements.lock requirements-dev.lock

      # 회귀 테스트는 100% pytest-httpx 모킹이라 실제 OpenAI 호출이 없다.
      # 따라서 OPENAI_API_KEY가 없는 fork PR에서도 그대로 통과한다.
      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short
